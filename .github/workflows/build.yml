name: Build Android APK

on:
  push:
    branches: [ "main", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🌟 تم نقل خطوة فك الضغط لتصبح هنا في البداية تماماً
    - name: Unzip and Structure Project Files
      run: |
        unzip -o *.zip
        
        TARGET_DIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \;)
        if [ "$TARGET_DIR" != "." ] && [ ! -z "$TARGET_DIR" ]; then
          echo "تم العثور على المشروع داخل المجلد: $TARGET_DIR"
          shopt -s dotglob
          mv "$TARGET_DIR"/* . || true
          shopt -u dotglob
        fi
        chmod +x gradlew

    # 🌟 تم تحديثها للإصدار v5 الأحدث وحذف خاصية الكاش لتجنب الخطأ تماماً
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp-Legend-APK
        path: app/build/outputs/apk/debug/app-debug.apk
