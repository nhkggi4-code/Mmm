name: Build Android APK

on:
  push:
    branches: [ "main", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip and Structure Project Files
      run: |
        # 1. فك ضغط أي ملف .zip موجود في المستودع
        unzip -o *.zip
        
        # 2. البحث التلقائي عن المجلد المفقود ونقل محتوياته للمجلد الرئيسي
        # هذه الخطوة تبحث عن المجلد الذي يحتوي على ملف settings.gradle.kts أو build.gradle.kts
        TARGET_DIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \;)
        
        if [ "$TARGET_DIR" != "." ]; then
          echo "تم العثور على المشروع داخل المجلد: $TARGET_DIR"
          # نقل كافة الملفات والمجلدات المخفية والعادية إلى المجلد الرئيسي للمستودع
          shopt -s dotglob
          mv "$TARGET_DIR"/* . || true
          shopt -u dotglob
        fi

        # 3. إعطاء صلاحيات التشغيل
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp-Legend-APK
        path: app/build/outputs/apk/debug/app-debug.apk
