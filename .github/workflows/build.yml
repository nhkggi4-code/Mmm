name: Build Android APK

on:
  push:
    branches: [ "main", "رئيسي" ] # تم إضافة فرع "رئيسي" ليتوافق مع مستودعك
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle # تسريع عملية البناء عبر التخزين المؤقت

    - name: Unzip project files
      run: |
        # فك الضغط داخل المجلد الحالي
        unzip -o *.zip
        
        # نقل الملفات من المجلد الفرعي إلى المجلد الرئيسي لتشغيل الكومبايلر بشكل صحيح
        mv عبداللهعبده/* . || true
        mv عبداللهعبده/.* . || true
        
        # إعطاء صلاحيات التشغيل لملف البناء
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4 # تحديث للإصدار v4 الأحدث والأسرع
      with:
        name: WhatsApp-Legend-APK
        path: app/build/outputs/apk/debug/app-debug.apk
