name: Build Android APK

on:
  push:
    branches: [ "main", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip and Structure Project Files
      run: |
        unzip -o *.zip
        
        TARGET_DIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \;)
        if [ "$TARGET_DIR" != "." ] && [ ! -z "$TARGET_DIR" ]; then
          echo "تم العثور على المشروع داخل المجلد: $TARGET_DIR"
          shopt -s dotglob
          mv "$TARGET_DIR"/* . || true
          shopt -u dotglob
        fi

    - name: Fix Kotlin SourceSets Properties
      run: |
        touch gradle.properties
        echo "android.disallowKotlinSourceSets=false" >> gradle.properties
        # إضافة سطر إضافي لحل مشاكل تعارض مكتبة الجيل الجديد لـ KSP والأندرويد
        echo "ksp.allow.all.descriptor.classes=true" >> gradle.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Stable Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.10.2
        chmod +x gradlew

    # 🌟 التعديل الحاسم: تشغيل بوضعية معلومات تفصيلية --info لإظهار اسم الملف والإضافة التالفة فوراً
    - name: Build APK with Stable Wrapper
      run: ./gradlew assembleDebug --info --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp-Legend-APK
        path: app/build/outputs/apk/debug/app-debug.apk
